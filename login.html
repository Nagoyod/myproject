<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-purple-700 min-h-screen flex justify-center items-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-2xl p-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h1>
            <p class="text-gray-500 text-sm">Sign in to your account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
            <!-- Email Input -->
            <div>
                <label for="email" class="block text-gray-800 font-semibold text-sm mb-2">
                    Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition duration-300"
                    required
                >
                <div class="text-red-500 text-xs mt-1 hidden" id="emailError">
                    Please enter a valid email
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-gray-800 font-semibold text-sm mb-2">
                    Password
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition duration-300"
                    required
                >
                <div class="text-red-500 text-xs mt-1 hidden" id="passwordError">
                    Password is required
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex justify-between items-center text-sm">
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        id="rememberMe" 
                        name="rememberMe"
                        class="w-4 h-4 text-indigo-600 rounded focus:ring-2 focus:ring-indigo-500 cursor-pointer"
                    >
                    <label for="rememberMe" class="ml-2 text-gray-700 cursor-pointer font-medium">
                        Remember me
                    </label>
                </div>
                <a href="#" class="text-indigo-600 hover:text-purple-700 font-medium transition">
                    Forgot password?
                </a>
            </div>

            <!-- Sign In Button -->
            <button 
                type="submit" 
                class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 rounded-lg transition transform hover:-translate-y-0.5 active:translate-y-0 shadow-md hover:shadow-lg"
            >
                Sign In
            </button>

            <!-- Success Message -->
            <div class="text-green-600 text-xs mt-3 hidden text-center font-medium" id="successMessage">
                Login successful!
            </div>
        </form>

        <!-- Sign Up Link -->
        <div class="text-center mt-6 text-gray-600 text-sm">
            Don't have an account? 
            <a href="#" class="text-indigo-600 hover:text-purple-700 font-bold transition">
                Sign up here
            </a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const successMessage = document.getElementById('successMessage');

        // Email validation regex
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;

            // Clear previous error messages
            emailError.classList.add('hidden');
            passwordError.classList.add('hidden');
            successMessage.classList.add('hidden');

            // Validate email
            if (!emailInput.value.trim()) {
                emailError.textContent = 'Email is required';
                emailError.classList.remove('hidden');
                isValid = false;
            } else if (!emailRegex.test(emailInput.value)) {
                emailError.textContent = 'Please enter a valid email';
                emailError.classList.remove('hidden');
                isValid = false;
            }

            // Validate password
            if (!passwordInput.value.trim()) {
                passwordError.textContent = 'Password is required';
                passwordError.classList.remove('hidden');
                isValid = false;
            } else if (passwordInput.value.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.remove('hidden');
                isValid = false;
            }

            // If valid, show success message
            if (isValid) {
                successMessage.classList.remove('hidden');
                console.log('Form submitted:', {
                    email: emailInput.value,
                    rememberMe: document.getElementById('rememberMe').checked
                });
                // Here you would typically send the data to a server
                // setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
            }
        });

        // Clear error on input
        emailInput.addEventListener('input', function() {
            if (this.value.trim()) {
                emailError.classList.add('hidden');
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.value.trim()) {
                passwordError.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
